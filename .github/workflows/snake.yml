
name: Generate Contribution Snake Animation

on:
  # Run every 12 hours
  schedule:
    - cron: "0 */12 * * *"

  # Allow manual execution
  workflow_dispatch:

  # Run when changes are pushed to main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: shiv-05-07
          outputs: |
            assets/contributions/github-contribution-grid-snake.svg
            assets/contributions/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00E58B&color_dots=#0D1711,#004729,#007A46,#00B86B,#00E58B

      - name: Commit updated snake animations
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update GitHub contribution snake"
          file_pattern: assets/contributions/*.svg
