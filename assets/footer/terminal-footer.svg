<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 180" width="920" height="180">
  <defs>
    <linearGradient id="footer-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050806" />
      <stop offset="50%" stop-color="#07130D" />
      <stop offset="100%" stop-color="#0A1810" />
    </linearGradient>

    <filter id="footer-cursor-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Soft Gaussian Blur for Vertical Green Glow Sweep -->
    <filter id="footer-green-bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" />
    </filter>

    <!-- Wide Soft Emerald Glow Aura -->
    <linearGradient id="footer-glow-aura" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E58B" stop-opacity="0" />
      <stop offset="18%" stop-color="#00B86B" stop-opacity="0.04" />
      <stop offset="36%" stop-color="#00E58B" stop-opacity="0.14" />
      <stop offset="50%" stop-color="#00E58B" stop-opacity="0.28" />
      <stop offset="64%" stop-color="#00E58B" stop-opacity="0.14" />
      <stop offset="82%" stop-color="#00B86B" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#00E58B" stop-opacity="0" />
    </linearGradient>

    <!-- Bright Inner Emerald-Lime Glow Core -->
    <linearGradient id="footer-glow-core" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E58B" stop-opacity="0" />
      <stop offset="30%" stop-color="#00E58B" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#B6FF72" stop-opacity="0.34" />
      <stop offset="70%" stop-color="#00E58B" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#00E58B" stop-opacity="0" />
    </linearGradient>

    <clipPath id="footer-clip">
      <rect width="920" height="180" rx="10" />
    </clipPath>

    <style>
      @keyframes footerTextFadeInUp {
        0% { opacity: 0; transform: translateY(12px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      .footer-text {
        animation: footerTextFadeInUp 0.85s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
    </style>
  </defs>

  <!-- Card Background -->
  <rect width="920" height="180" rx="10" fill="url(#footer-bg)" stroke="#173B2A" stroke-width="1.2" />

  <!-- Animated top hairline flow -->
  <line x1="20" y1="2" x2="900" y2="2" stroke="#00E58B" stroke-width="1.5" stroke-dasharray="100 200">
    <animate attributeName="stroke-dashoffset" values="300;0" dur="5s" repeatCount="indefinite" />
  </line>

  <!-- Terminal Command Line -->
  <g transform="translate(45, 42)">
    <text class="footer-text" x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="13" fill="#8A9A90">shivam@github ~ $ </text>
    <text class="footer-text" x="145" y="0" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#00E58B">./keep-building.sh</text>

    <!-- Blinking green cursor -->
    <rect x="305" y="-12" width="8" height="15" fill="#00E58B" filter="url(#footer-cursor-glow)">
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Main Statement -->
  <g transform="translate(45, 85)">
    <text class="footer-text" x="0" y="0" font-family="'Outfit', 'Space Grotesk', sans-serif" font-size="20" font-weight="800" fill="#F2F7F3" letter-spacing="1">THANKS FOR STOPPING BY. KEEP CREATING.</text>
    <text class="footer-text" x="0" y="24" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#8A9A90">Designed with Emerald / After Dark Aesthetics · Built with Code &amp; Precision</text>
  </g>

  <!-- Animated Audio/Heartbeat Waveform on the Right -->
  <g transform="translate(680, 55)">
    <rect x="0" y="15" width="4" height="20" rx="2" fill="#00B86B">
      <animate attributeName="height" values="20;38;10;28;20" dur="1.2s" repeatCount="indefinite" />
      <animate attributeName="y" values="15;6;20;11;15" dur="1.2s" repeatCount="indefinite" />
    </rect>
    <rect x="10" y="8" width="4" height="34" rx="2" fill="#00E58B">
      <animate attributeName="height" values="34;12;46;22;34" dur="1.4s" repeatCount="indefinite" />
      <animate attributeName="y" values="8;19;2;14;8" dur="1.4s" repeatCount="indefinite" />
    </rect>
    <rect x="20" y="2" width="4" height="46" rx="2" fill="#B6FF72">
      <animate attributeName="height" values="46;24;52;16;46" dur="1.1s" repeatCount="indefinite" />
      <animate attributeName="y" values="2;13;-1;17;2" dur="1.1s" repeatCount="indefinite" />
    </rect>
    <rect x="30" y="12" width="4" height="26" rx="2" fill="#00E58B">
      <animate attributeName="height" values="26;48;14;36;26" dur="1.5s" repeatCount="indefinite" />
      <animate attributeName="y" values="12;1;18;7;12" dur="1.5s" repeatCount="indefinite" />
    </rect>
    <rect x="40" y="18" width="4" height="14" rx="2" fill="#00B86B">
      <animate attributeName="height" values="14;32;8;24;14" dur="1.3s" repeatCount="indefinite" />
      <animate attributeName="y" values="18;9;21;13;18" dur="1.3s" repeatCount="indefinite" />
    </rect>
    <rect x="50" y="6" width="4" height="38" rx="2" fill="#00E58B">
      <animate attributeName="height" values="38;18;44;12;38" dur="1.6s" repeatCount="indefinite" />
      <animate attributeName="y" values="6;16;3;19;6" dur="1.6s" repeatCount="indefinite" />
    </rect>
    <rect x="60" y="20" width="4" height="10" rx="2" fill="#004729" />

    <text class="footer-text" x="80" y="28" font-family="'JetBrains Mono', monospace" font-size="9" fill="#00E58B">2026 // LIVE</text>
  </g>

  <!-- Bottom Coordinates / Metadata Strip -->
  <g transform="translate(45, 150)">
    <line x1="0" y1="0" x2="830" y2="0" stroke="#173B2A" stroke-width="0.8" />
    <text class="footer-text" x="0" y="16" font-family="'JetBrains Mono', monospace" font-size="9" fill="#8A9A90">VADODARA · 22.3072° N, 73.1812° E</text>
    <text class="footer-text" x="350" y="16" font-family="'JetBrains Mono', monospace" font-size="9" fill="#00E58B">GITHUB: @shiv-05-07</text>
    <text class="footer-text" x="660" y="16" font-family="'JetBrains Mono', monospace" font-size="9" fill="#8A9A90">ALL RIGHTS RESERVED // 2026</text>
  </g>

  <!-- Periodic Vertical Slightly-Tilted (/) Emerald Green Glow Sweep (Left to Right) -->
  <g clip-path="url(#footer-clip)" pointer-events="none">
    <g transform="skewX(-16)">
      <!-- Wide diffused green glow aura -->
      <rect x="-320" y="-40" width="260" height="260" fill="url(#footer-glow-aura)" filter="url(#footer-green-bloom)">
        <animate
          attributeName="x"
          values="-320;1080;1080"
          keyTimes="0;0.72;1"
          dur="4.8s"
          repeatCount="indefinite"
        />
      </rect>
      <!-- Luminous inner green glow core -->
      <rect x="-240" y="-40" width="100" height="260" fill="url(#footer-glow-core)" filter="url(#footer-green-bloom)">
        <animate
          attributeName="x"
          values="-240;1160;1160"
          keyTimes="0;0.72;1"
          dur="4.8s"
          repeatCount="indefinite"
        />
      </rect>
    </g>
  </g>
</svg>
