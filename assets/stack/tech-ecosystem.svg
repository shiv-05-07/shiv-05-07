<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="100%" height="100%">
  <defs>
    <linearGradient id="stack-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050806" />
      <stop offset="50%" stop-color="#08140E" />
      <stop offset="100%" stop-color="#0E1B13" />
    </linearGradient>
    <filter id="stack-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      @keyframes textFadeInUp {
        0% { opacity: 0; transform: translateY(14px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      text {
        animation: textFadeInUp 0.85s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
    </style>
  </defs>

  <rect width="920" height="400" fill="url(#stack-bg)" rx="12" />

  <!-- Outer frame -->
  <rect x="20" y="20" width="880" height="360" rx="8" fill="none" stroke="#173B2A" stroke-width="1.2" />
  <line x1="20" y1="65" x2="900" y2="65" stroke="#173B2A" stroke-width="1" />
  
  <text x="40" y="48" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8A9A90" letter-spacing="1.5">ECOSYSTEM // TECH MATRIX</text>
  <text x="460" y="48" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#00E58B" letter-spacing="1">TECHNOLOGY STACK · REAL TOOLS &amp; ARCHITECTURES</text>
  <text x="880" y="48" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8A9A90" letter-spacing="1">CORE TECHNOLOGIES</text>

  <!-- 5 Technology Groups -->
  <!-- 01: LANGUAGES -->
  <g transform="translate(40, 85)">
    <rect width="156" height="235" rx="6" fill="#0D1711" stroke="#173B2A" stroke-width="1" />
    <rect x="0" y="0" width="156" height="32" rx="6" fill="#09120D" />
    <text x="14" y="20" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#00E58B">01 // LANGUAGES</text>
    
    <!-- Item 1: C -->
    <g transform="translate(14, 48)">
      <circle cx="10" cy="10" r="4" fill="#00E58B" />
      <text x="24" y="14" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#F2F7F3">C</text>
      <text x="24" y="28" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#8A9A90">Systems &amp; Algos</text>
    </g>

    <!-- Item 2: C++ -->
    <g transform="translate(14, 94)">
      <circle cx="10" cy="10" r="4" fill="#00E58B" />
      <text x="24" y="14" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#F2F7F3">C++</text>
      <text x="24" y="28" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#8A9A90">DSA &amp; Performance</text>
    </g>

    <!-- Item 3: Java -->
    <g transform="translate(14, 140)">
      <circle cx="10" cy="10" r="4" fill="#00E58B" />
      <text x="24" y="14" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#F2F7F3">Java</text>
      <text x="24" y="28" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#8A9A90">Java 8, Swing, OOP</text>
    </g>

    <!-- Item 4: Python -->
    <g transform="translate(14, 186)">
      <circle cx="10" cy="10" r="4" fill="#00E58B" />
      <text x="24" y="14" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#F2F7F3">Python</text>
      <text x="24" y="28" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#8A9A90">Scripting &amp; AI</text>
    </g>
  </g>

  <!-- 02: WEB DEVELOPMENT -->
  <g transform="translate(212, 85)">
    <rect width="156" height="235" rx="6" fill="#0D1711" stroke="#00E58B" stroke-width="1.2" />
    <rect x="0" y="0" width="156" height="32" rx="6" fill="#09120D" />
    <text x="14" y="20" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#B6FF72">02 // WEB DEV</text>
    
    <!-- Item 1: React -->
    <g transform="translate(14, 48)">
      <circle cx="10" cy="10" r="4" fill="#B6FF72" />
      <text x="24" y="14" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#F2F7F3">React</text>
      <text x="24" y="28" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#8A9A90">Components, SPA</text>
    </g>

    <!-- Item 2: HTML -->
    <g transform="translate(14, 94)">
      <circle cx="10" cy="10" r="4" fill="#B6FF72" />
      <text x="24" y="14" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#F2F7F3">HTML</text>
      <text x="24" y="28" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#8A9A90">Semantic Web</text>
    </g>

    <!-- Item 3: CSS -->
    <g transform="translate(14, 140)">
      <circle cx="10" cy="10" r="4" fill="#B6FF72" />
      <text x="24" y="14" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#F2F7F3">CSS</text>
      <text x="24" y="28" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#8A9A90">Tailwind, Layouts</text>
    </g>

    <!-- Item 4: Node.js -->
    <g transform="translate(14, 186)">
      <circle cx="10" cy="10" r="4" fill="#B6FF72" />
      <text x="24" y="14" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#F2F7F3">Node.js</text>
      <text x="24" y="28" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#8A9A90">Express APIs, Runtimes</text>
    </g>
  </g>

  <!-- 03: AI / ML -->
  <g transform="translate(384, 85)">
    <rect width="156" height="235" rx="6" fill="#0D1711" stroke="#173B2A" stroke-width="1" />
    <rect x="0" y="0" width="156" height="32" rx="6" fill="#09120D" />
    <text x="14" y="20" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#00E58B">03 // AI / ML</text>
    
    <!-- Item 1: Generative AI -->
    <g transform="translate(14, 52)">
      <circle cx="10" cy="10" r="4" fill="#00E58B" />
      <text x="24" y="14" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#F2F7F3">Generative AI</text>
      <text x="24" y="32" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#8A9A90">LLM pipelines &amp; prompts</text>
    </g>

    <!-- Item 2: AI API Integrations -->
    <g transform="translate(14, 115)">
      <circle cx="10" cy="10" r="4" fill="#00E58B" />
      <text x="24" y="14" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#F2F7F3">AI APIs</text>
      <text x="24" y="32" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#8A9A90">Gemini SDK, multimodal</text>
    </g>

    <g transform="translate(14, 175)">
      <rect width="128" height="35" rx="4" fill="#050806" stroke="#173B2A" stroke-width="0.8" />
      <text x="10" y="21" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#00E58B">Gemini Ecosystem</text>
    </g>
  </g>

  <!-- 04: DATABASES -->
  <g transform="translate(556, 85)">
    <rect width="156" height="235" rx="6" fill="#0D1711" stroke="#173B2A" stroke-width="1" />
    <rect x="0" y="0" width="156" height="32" rx="6" fill="#09120D" />
    <text x="14" y="20" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#00E58B">04 // DATABASES</text>
    
    <!-- Item 1: Supabase -->
    <g transform="translate(14, 52)">
      <circle cx="10" cy="10" r="4" fill="#00E58B" />
      <text x="24" y="14" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#F2F7F3">Supabase</text>
      <text x="24" y="32" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#8A9A90">PostgreSQL, Auth, Sync</text>
    </g>

    <!-- Item 2: MySQL -->
    <g transform="translate(14, 115)">
      <circle cx="10" cy="10" r="4" fill="#00E58B" />
      <text x="24" y="14" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#F2F7F3">MySQL</text>
      <text x="24" y="32" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#8A9A90">Relational schemas, SQL</text>
    </g>

    <g transform="translate(14, 175)">
      <rect width="128" height="35" rx="4" fill="#050806" stroke="#173B2A" stroke-width="0.8" />
      <text x="10" y="21" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#00E58B">Structured Queries</text>
    </g>
  </g>

  <!-- 05: TOOLS & PLATFORMS -->
  <g transform="translate(728, 85)">
    <rect width="152" height="235" rx="6" fill="#0D1711" stroke="#173B2A" stroke-width="1" />
    <rect x="0" y="0" width="152" height="32" rx="6" fill="#09120D" />
    <text x="14" y="20" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#00E58B">05 // TOOLS</text>
    
    <!-- Item 1: Git -->
    <g transform="translate(14, 48)">
      <circle cx="10" cy="10" r="4" fill="#00E58B" />
      <text x="24" y="14" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#F2F7F3">Git</text>
      <text x="24" y="28" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#8A9A90">Branching &amp; Version</text>
    </g>

    <!-- Item 2: GitHub -->
    <g transform="translate(14, 98)">
      <circle cx="10" cy="10" r="4" fill="#00E58B" />
      <text x="24" y="14" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#F2F7F3">GitHub</text>
      <text x="24" y="28" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#8A9A90">CI/CD, Actions, PRs</text>
    </g>

    <!-- Item 3: Vercel -->
    <g transform="translate(14, 148)">
      <circle cx="10" cy="10" r="4" fill="#00E58B" />
      <text x="24" y="14" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#F2F7F3">Vercel</text>
      <text x="24" y="28" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#8A9A90">Edge Cloud Hosting</text>
    </g>
  </g>

  <!-- Bottom status -->
  <g transform="translate(40, 345)">
    <circle cx="6" cy="6" r="3" fill="#00E58B" />
    <text x="18" y="9" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#8A9A90">CURATED STACK // ENGINEERED FOR PRODUCTION PERFORMANCE &amp; SCALABILITY</text>
  </g>
</svg>
