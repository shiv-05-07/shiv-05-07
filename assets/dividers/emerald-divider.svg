<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 20" width="100%" height="100%">
  <defs>
    <linearGradient id="divider-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#173B2A" stop-opacity="0" />
      <stop offset="30%" stop-color="#173B2A" stop-opacity="1" />
      <stop offset="50%" stop-color="#00E58B" stop-opacity="1" />
      <stop offset="70%" stop-color="#173B2A" stop-opacity="1" />
      <stop offset="100%" stop-color="#173B2A" stop-opacity="0" />
    </linearGradient>
    <filter id="light-node-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Baseline track -->
  <line x1="40" y1="10" x2="880" y2="10" stroke="#173B2A" stroke-width="1" />
  <!-- Illuminated segment -->
  <line x1="200" y1="10" x2="720" y2="10" stroke="url(#divider-grad)" stroke-width="1.5" />
  
  <!-- Travelling light beam via SMIL animation -->
  <circle cx="460" cy="10" r="3" fill="#B6FF72" filter="url(#light-node-glow)">
    <animate attributeName="cx" values="120;800;120" dur="8s" repeatCount="indefinite" />
  </circle>
  <circle cx="460" cy="10" r="1.5" fill="#FFFFFF">
    <animate attributeName="cx" values="120;800;120" dur="8s" repeatCount="indefinite" />
  </circle>
</svg>
